<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Golf league editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f5ee;--surface:#fff;--fg:#17231a;--muted:#5c6b5e;--line:#d3dbd1;--accent:#2c6a3e;--accent-fg:#fff;--soft:#e3ede2;--open:#a8601a;--warn-bg:#fbeedc;--ok:#2c6a3e;
 --display:'Archivo',system-ui,sans-serif;--body:'Public Sans',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111a14;--surface:#1a2520;--fg:#e7eee6;--muted:#9fb1a3;--line:#2c3a30;--accent:#62b97a;--accent-fg:#0d1a10;--soft:#213126;--open:#e4a35d;--warn-bg:#3a2d1c;--ok:#62b97a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 max(16px,env(safe-area-inset-left)) 56px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0}
h1{font-size:clamp(22px,4vw,32px);font-weight:800}
h2{font-size:20px;font-weight:700;margin-bottom:10px}
h3{font-size:17px;font-weight:700}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;padding:24px 0 14px;border-bottom:3px solid var(--accent)}
.top .meta{color:var(--muted);margin-top:4px}
.top .meta a,.msg a{color:var(--accent)}
button{font:inherit;font-family:var(--display);font-weight:700;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg)}
button.quiet{border-color:var(--line);color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
a.btn{display:inline-block;font-family:var(--display);font-weight:700;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 14px;text-decoration:none}
section{margin-top:28px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.note{color:var(--muted);font-size:13px;margin-top:8px}
.editbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.editbar .msg{color:var(--muted);font-size:13px;flex:1 1 200px}
.editbar .msg.ok{color:var(--ok)}.editbar .msg.bad{color:var(--open)}
.tokenbox{margin-top:14px;background:var(--warn-bg);border:1px solid var(--open);border-radius:10px;padding:12px;display:grid;gap:8px}
.tokenbox .row{display:flex;flex-wrap:wrap;gap:8px}
.tokenbox input{flex:1 1 260px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input.num{width:5.5em;text-align:right}
textarea{min-height:60px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.editweek{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:14px}
.editweek .head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:10px}
.editweek .head label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.editweek .head label.check{grid-auto-flow:column;align-items:center;gap:6px}
.editweek .head input[type=checkbox]{width:auto}
.counts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 8px}
.counts b{color:var(--fg)}.counts .over{color:var(--open)}
.hiddenwk{opacity:.65}
.dirty{outline:2px solid var(--open);outline-offset:-2px}
tr.uneven td{color:var(--open);font-weight:600}
</style></head>
<body><div id="app" class="wrap"><p class="note">Loading...</p></div>
<script src="app.js"></script></body></html>
